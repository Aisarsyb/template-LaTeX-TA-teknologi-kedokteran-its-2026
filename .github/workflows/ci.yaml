name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0

      - name: Compile Sempro
        uses: xu-cheng/latex-action@v3
        with:
          root_file: sempro.tex
          working_directory: skills/tugas-akhir/template

      - name: Compile Buku TA
        uses: xu-cheng/latex-action@v3
        with:
          root_file: buku-ta.tex
          working_directory: skills/tugas-akhir/template

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp skills/tugas-akhir/template/sempro.pdf dist/sempro.pdf
          cp skills/tugas-akhir/template/buku-ta.pdf dist/buku-ta.pdf
          cp skills/tugas-akhir/template/sempro.pdf dist/main.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
